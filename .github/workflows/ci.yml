name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore condominio_api.csproj

      - name: Build
        run: dotnet build condominio_api.csproj --configuration Release --no-restore --warnaserror

      - name: Audit dependencies
        run: dotnet list condominio_api.csproj package --vulnerable --include-transitive
